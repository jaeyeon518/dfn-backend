spring.application.name=data-ingestion
server.port=8080

app.kafka.topic.ingestion-events=ingestion.events.v1

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# reliability-oriented producer baseline
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.max.block.ms=1000

# local async handoff so HTTP can return immediately after enqueue
app.ingestion.async.core-pool-size=4
app.ingestion.async.max-pool-size=8
app.ingestion.async.queue-capacity=5000
app.ingestion.async.await-termination-seconds=30
